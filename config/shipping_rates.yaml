# Delivery-to-Yerevan cost model. EVERY number here must come from a real,
# dated source. `null` means "unknown" — the report then shows the value as
# UNAVAILABLE instead of guessing. Update rates from your forwarder account.

destination:
  city: "Yerevan"
  country: "AM"

exchange_rates:
  # Primary: Central Bank of Armenia official rates (free, no key).
  primary: "cba"
  cba_url: "https://api.cba.am/exchangerates.asmx"
  # Fallback: open.er-api.com (free, no key). If EXCHANGE_RATE_API_KEY is set,
  # https://v6.exchangerate-api.com/v6/<key>/latest/USD is used instead.
  fallback: "open_er_api"
  fallback_url: "https://open.er-api.com/v6/latest/USD"

# Armenian customs for goods bought online by individuals (EAEU rules).
# Source checked 2026-11-19:
#   - €200 / 31 kg duty-free per parcel, 15 % on the excess value, but not less
#     than €2 per kg of the excess weight — Arka.am / Armenia SRC (in force since 2024-04-01).
#   - An EAEU e-commerce reform (5 %, min €1/kg, same €200 threshold) was reported
#     in Aug 2026 (Interfax) but entry into force in Armenia is NOT confirmed.
# Switch `active_regime` once the State Revenue Committee (src.am) confirms.
customs:
  active_regime: "eaeu_2024"
  verified_on: "2026-11-19"
  regimes:
    eaeu_2024:
      duty_free_value_eur: 200
      duty_free_weight_kg: 31
      rate_on_excess_pct: 15
      min_eur_per_excess_kg: 2
      source: "https://arka.am/en/news/business/armenia_to_lower_duty_free_online_trade_threshold_to_200_euros"
    eaeu_ecommerce_reform:
      duty_free_value_eur: 200
      duty_free_weight_kg: 31
      rate_on_excess_pct: 5
      min_eur_per_excess_kg: 1
      source: "https://interfax.com/newsroom/top-stories/118645/ (planned, unconfirmed)"
  # Value used for the threshold: product price + domestic shipping (forwarder
  # international fee is normally NOT included for individuals). Set to true to
  # be conservative and include it.
  include_international_shipping_in_value: false

# Forwarders. Rates per chargeable kg. Fill in from your own account.
# chargeable weight = max(actual, volumetric) when dimensions AND volumetric_divisor are known,
# otherwise actual (or estimated) weight only — this is flagged in the report.
forwarders:
  - id: onex_us
    name: "Onex (склад в США)"
    origin: US
    rate_per_kg: 6000
    rate_currency: AMD
    min_chargeable_kg: null
    rounding_kg: 0.1
    volumetric_divisor: null
    insurance_pct: null
    handling_fee: 0
    # Warehouse address in Delaware: no US sales tax (confirmed by user 2026-11-19).
    origin_sales_tax_pct: 0
    verified: true
    source: "6000 AMD/kg confirmed by user 2026-11-19 (also listed on https://onex.am/en/pages/2)"
  - id: onex_de
    name: "Onex (склад в Германии)"
    origin: DE
    rate_per_kg: 6000
    rate_currency: AMD
    min_chargeable_kg: null
    rounding_kg: 0.1
    volumetric_divisor: null
    insurance_pct: null
    handling_fee: 0
    origin_sales_tax_pct: 0      # German prices already include 19 % VAT
    verified: true
    source: "6000 AMD/kg, same as USA — confirmed by user 2026-11-19"
  - id: onex_uk
    name: "Onex (склад в Великобритании)"
    origin: UK
    rate_per_kg: 6000
    rate_currency: AMD
    min_chargeable_kg: null
    rounding_kg: 0.1
    volumetric_divisor: null
    insurance_pct: null
    handling_fee: 0
    origin_sales_tax_pct: 0      # UK prices already include 20 % VAT
    verified: true
    source: "6000 AMD/kg, same as USA — confirmed by user 2026-11-19"

# Domestic delivery from the shop to the forwarder's warehouse, per origin.
# Used only when the deal does not say "free shipping/delivery". null = unknown.
domestic_shipping_default:
  US: null
  DE: null
  UK: null

# Retailers that ship directly to Armenia (route "direct"). Rates are usually
# shown only at checkout, so leave empty unless you know a fixed rate.
direct_shipping: []
