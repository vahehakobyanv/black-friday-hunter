# Data sources and retailers.
#
# WHY these sources: most retailers (Amazon, Walmart, Newegg, MediaMarkt, Currys ...)
# have no free public API and forbid automated scraping in their terms/robots.txt,
# or block data-centre IPs such as GitHub Actions. This app does NOT bypass blocks.
# Instead it reads permitted public deal feeds that already cover those retailers,
# plus official free APIs where you provide a key.

sources:
  - id: mydealz_hot
    type: pepper
    enabled: true
    region: DE
    currency: EUR
    feed_url: "https://www.mydealz.de/rss/hot"
    site: "https://www.mydealz.de"
  - id: mydealz_new
    type: pepper
    enabled: true
    region: DE
    currency: EUR
    feed_url: "https://www.mydealz.de/rss/new"
    site: "https://www.mydealz.de"
  - id: hotukdeals_hot
    type: pepper
    enabled: true
    region: UK
    currency: GBP
    feed_url: "https://www.hotukdeals.com/rss/hot"
    site: "https://www.hotukdeals.com"
  - id: hotukdeals_new
    type: pepper
    enabled: true
    region: UK
    currency: GBP
    feed_url: "https://www.hotukdeals.com/rss/new"
    site: "https://www.hotukdeals.com"
  # Topic feeds: more consoles, games, TVs, electronics, smart home, home and
  # kitchen deals. `category` is a hint used when the title alone is not specific.
  - id: mydealz_topics
    type: pepper
    enabled: true
    region: DE
    currency: EUR
    site: "https://www.mydealz.de"
    enrich_budget: 25
    feeds:
      - {url: "https://www.mydealz.de/rss/gruppe/playstation", category: gaming}
      - {url: "https://www.mydealz.de/rss/gruppe/xbox", category: gaming}
      - {url: "https://www.mydealz.de/rss/gruppe/nintendo", category: gaming}
      - {url: "https://www.mydealz.de/rss/gruppe/gaming", category: gaming}
      - {url: "https://www.mydealz.de/rss/gruppe/fernseher", category: tv_electronics}
      - {url: "https://www.mydealz.de/rss/gruppe/elektronik", category: tv_electronics}
      - {url: "https://www.mydealz.de/rss/gruppe/smart-home", category: smart_home}
      - {url: "https://www.mydealz.de/rss/gruppe/haushaltsgeraete", category: appliances}
      - {url: "https://www.mydealz.de/rss/gruppe/kueche", category: kitchen}
      - {url: "https://www.mydealz.de/rss/gruppe/kuechengeraete", category: kitchen}
      - {url: "https://www.mydealz.de/rss/gruppe/kaffeevollautomaten", category: kitchen}
      - {url: "https://www.mydealz.de/rss/gruppe/home-living", category: home_furniture}
  - id: hotukdeals_topics
    type: pepper
    enabled: true
    region: UK
    currency: GBP
    site: "https://www.hotukdeals.com"
    enrich_budget: 25
    feeds:
      - {url: "https://www.hotukdeals.com/rss/tag/playstation", category: gaming}
      - {url: "https://www.hotukdeals.com/rss/tag/xbox", category: gaming}
      - {url: "https://www.hotukdeals.com/rss/tag/nintendo", category: gaming}
      - {url: "https://www.hotukdeals.com/rss/tag/gaming", category: gaming}
      - {url: "https://www.hotukdeals.com/rss/tag/tv", category: tv_electronics}
      - {url: "https://www.hotukdeals.com/rss/tag/electronics", category: tv_electronics}
      - {url: "https://www.hotukdeals.com/rss/tag/smart-home", category: smart_home}
      - {url: "https://www.hotukdeals.com/rss/tag/appliances", category: appliances}
      - {url: "https://www.hotukdeals.com/rss/tag/kitchen", category: kitchen}
      - {url: "https://www.hotukdeals.com/rss/tag/kitchen-appliances", category: kitchen}
      - {url: "https://www.hotukdeals.com/rss/tag/home", category: home_furniture}
  - id: dealnews
    type: dealnews
    enabled: true
    region: US
    currency: USD
    feed_urls:
      - "https://www.dealnews.com/?rss=1&sort=time"
      - "https://www.dealnews.com/c39/Computers/?rss=1"
      - "https://www.dealnews.com/c113/Computers/Upgrades-Components/Video-Cards/?rss=1"
      - "https://www.dealnews.com/c142/Electronics/?rss=1"
      - "https://www.dealnews.com/c159/Electronics/TVs/?rss=1"
      - "https://www.dealnews.com/c171/Electronics/Phones-Cell-Phones/?rss=1"
      - "https://www.dealnews.com/c191/Gaming-Toys/Video-Games/?rss=1"
      - "https://www.dealnews.com/c304/Home-Garden/Appliances/?rss=1"
      - "https://www.dealnews.com/c199/Home-Garden/Home-Furniture/?rss=1"
      - "https://www.dealnews.com/c202/Clothing-Accessories/?rss=1"
      - "https://www.dealnews.com/c280/Clothing-Accessories/Shoes/?rss=1"
      - "https://www.dealnews.com/c287/Clothing-Accessories/Luggage-Travel-Gear/?rss=1"
    feeds:
      - {url: "https://www.dealnews.com/c191/Gaming-Toys/Video-Games/f1915/Play-Station-5/?rss=1", category: gaming}
      - {url: "https://www.dealnews.com/c191/Gaming-Toys/Video-Games/f1918/Xbox-Series-S-X/?rss=1", category: gaming}
      - {url: "https://www.dealnews.com/c191/Gaming-Toys/Video-Games/f1652/Nintendo-Switch/?rss=1", category: gaming}
      - {url: "https://www.dealnews.com/c148/Electronics/Audio-Components/Home-Theater-Systems/?rss=1", category: tv_electronics}
      - {url: "https://www.dealnews.com/c155/Electronics/Audio-Components/Headphones/?rss=1", category: tv_electronics}
      - {url: "https://www.dealnews.com/c201/Home-Garden/Kitchen/?rss=1", category: kitchen}
      - {url: "https://www.dealnews.com/c1009/Home-Garden/Appliances/Household-Items/Vacuum-Cleaners/Robot-Vacuums/?rss=1", category: appliances}
      - {url: "https://www.dealnews.com/c196/Home-Garden/?rss=1", category: home_furniture}
      # Store feeds: every deal dealnews editors found at these US shops.
      - {url: "https://www.dealnews.com/s313/Amazon/?rss=1"}
      - {url: "https://www.dealnews.com/s321/Walmart/?rss=1"}
      - {url: "https://www.dealnews.com/s560/Best-Buy/?rss=1"}
      - {url: "https://www.dealnews.com/s897/Costco/?rss=1"}
      - {url: "https://www.dealnews.com/s504/Newegg/?rss=1"}
      - {url: "https://www.dealnews.com/s1692/Woot-An-Amazon-Company/?rss=1"}
      - {url: "https://www.dealnews.com/s1662/Lenovo/?rss=1", category: laptops}
      - {url: "https://www.dealnews.com/s604/Dell-Technologies/?rss=1", category: laptops}
      - {url: "https://www.dealnews.com/s6058/Samsung/?rss=1"}
      - {url: "https://www.dealnews.com/s415/Apple/?rss=1"}
      - {url: "https://www.dealnews.com/s958/Home-Depot/?rss=1"}
      - {url: "https://www.dealnews.com/s50/eBay/?rss=1"}
  - id: dealcatcher
    type: dealcatcher
    enabled: true
    region: US
    currency: USD
    # One product per item ("Amazon - Product $price"); mostly Amazon, also Walmart, Home Depot, Macy's.
    feed_urls:
      - "https://www.dealcatcher.com/rss"
  - id: 9to5toys
    type: editorial_rss
    enabled: true
    region: US
    currency: USD
    # Editor-written posts. Only single-product headlines with one clear price are used.
    feeds:
      - {url: "https://9to5toys.com/feed/"}
      - {url: "https://9to5toys.com/guides/apple/feed/"}
      - {url: "https://9to5toys.com/guides/games/feed/", category: gaming}
  - id: bf_ads
    type: bf_ads
    enabled: true
    region: US
    currency: USD
    # Black Friday / Cyber Monday ad pages (schema.org product list) at blackfriday.com.
    # Robots.txt allows these pages; the email links to each store's full ad scan.
    base_url: "https://blackfriday.com/ads"
    ad_pages:
      - {event: black-friday, slug: walmart, store: Walmart}
      - {event: black-friday, slug: target, store: Target}
      - {event: black-friday, slug: best-buy, store: Best Buy}
      - {event: black-friday, slug: amazon, store: Amazon}
      - {event: black-friday, slug: costco, store: Costco}
      - {event: black-friday, slug: newegg, store: Newegg}
      - {event: black-friday, slug: dell-consumer, store: Dell}
      - {event: black-friday, slug: sams-club, store: Sam's Club}
      - {event: black-friday, slug: home-depot, store: Home Depot}
      - {event: black-friday, slug: kohls, store: Kohl's}
      - {event: black-friday, slug: macys, store: Macy's}
      - {event: black-friday, slug: lowes, store: Lowe's}
      - {event: cyber-monday, slug: amazon, store: Amazon}
      - {event: cyber-monday, slug: best-buy, store: Best Buy}
      - {event: cyber-monday, slug: dell-consumer, store: Dell}
  - id: bestbuy
    type: bestbuy
    enabled: true            # runs only when env BESTBUY_API_KEY is set
    region: US
    currency: USD
    # Best Buy Products API query: items on sale, sorted by savings.
    queries:
      - "onSale=true&categoryPath.name=Laptops"
      - "onSale=true&categoryPath.name=Cell Phones"
      - "onSale=true&categoryPath.name=TVs"
      - "onSale=true&categoryPath.name=Video Games"
      - "onSale=true&categoryPath.name=Computer Cards"   # don't use '&' inside values
      - "onSale=true&categoryPath.name=Monitors"
      - "onSale=true&categoryPath.name=Smart Home"
    page_size: 50
  - id: ebay
    type: ebay
    enabled: true            # runs only when env EBAY_CLIENT_ID + EBAY_CLIENT_SECRET are set
    region: US
    currency: USD
    marketplace: EBAY_US
    # Searches use your watchlist keywords; only new-condition, fixed-price items.
    max_per_keyword: 10
  - id: watchlist_pages
    type: generic_store
    enabled: true            # reads product URLs listed in watchlist.json (robots.txt permitting)
    region: auto
    currency: auto

# Retailer reliability 0..1 (used for 10 % of the score and for choosing the
# cheapest TRUSTWORTHY offer). Unknown retailers get `default_reliability`.
# Marketplace sellers (AliExpress stores, eBay sellers) are lower on purpose.
default_reliability: 0.55
retailers:
  # USA
  "Amazon": {reliability: 0.95, aliases: ["amazon.com", "amazon.de", "amazon.co.uk", "amazon prime"]}
