               "kopfhörer", "speaker", "lautsprecher", "camera", "kamera", "projector", "beamer",
               "kindle", "e-reader", "bose", "sony wh", "sonos"]
    feed_categories: ["Electronics", "TVs", "Audio", "TV & Video", "Elektronik", "Audio & Hifi"]
    est_weight_kg: 2.0
    bf_extra_drop_pct: 7
    cm_extra_drop_pct: 2
  smart_home:
    label: "Smart home"
    keywords: ["smart home", "echo dot", "echo show", "alexa", "google nest", "nest hub", "ring",
               "philips hue", "hue", "smart plug", "eero", "mesh", "router", "wifi", "wlan",
               "fritz!box", "ip camera", "security camera", "robot vacuum", "saugroboter", "roborock"]
    feed_categories: ["Smart Home", "Home Automation", "Broadband & Phone Contracts"]
    est_weight_kg: 1.5
    bf_extra_drop_pct: 7
    cm_extra_drop_pct: 2
  appliances:
    label: "Home appliances"
