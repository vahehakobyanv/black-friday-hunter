               "geschirrspüler", "fridge", "kühlschrank", "air fryer", "heißluftfritteuse",
               "coffee machine", "kaffeevollautomat", "espresso", "vacuum", "staubsauger",
               "dyson", "microwave", "blender", "thermomix", "kettle"]
    feed_categories: ["Appliances", "Home Appliances", "Haushalt", "Kitchen"]
    est_weight_kg: 6.0
    bf_extra_drop_pct: 5
    cm_extra_drop_pct: 2
  clothing:
