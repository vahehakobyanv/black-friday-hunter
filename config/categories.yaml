# Deals whose title matches any of these are not products (contracts, cashback,
# vouchers, subscriptions, food) and are skipped entirely.
non_product_keywords: ["sim only", "allnet", "tarif", "vertrag", "contract", "cashback",
                       "gutschein", "voucher", "coupon", "subscription", "abo ", "broadband",
                       "strom", "gas ", "versicherung", "insurance", "whisky", "wine", "beer",
                       "flight", "hotel", "airfare", "car rental", "magazine", "gift card",
                       "mint mobile", "wireless plan", "phone plan", "unlimited plan", "prepaid plan", "esim",
                       "streaming", "membership",
                       "free game", "freebie", "gratis", "kostenlos", "bulbs", "grocer"]
non_product_feed_categories: ["Broadband & Phone Contracts", "Verträge", "Groceries", "Food & Drink",
                              "Travel-Entertainment", "Airfare", "Hotels", "Freebies", "Kostenloses",
                              "Gutscheine", "Vouchers", "Services & Contracts", "Lebensmittel & Haushalt",
                              "Culture & Leisure", "Restaurants", "Health & Beauty", "Drogerie"]
