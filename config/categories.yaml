# Product categories.
#
# keywords: matched (case-insensitive, word-boundary) against the title. A trailing
#           '*' makes it a prefix: "galaxy s*" matches "Galaxy S25".
#           Order matters: the FIRST category whose keyword matches wins, so the
#           more specific categories (PC components) come first.
# feed_categories: category names used by the source feeds that map here.
# est_weight_kg: ESTIMATED shipping weight used ONLY when the source gives no
#           weight. Always labelled "estimated weight" in the report. Edit freely.
# bf_extra_drop_pct: HEURISTIC assumption of how much further a typical price in
#           this category may fall between now and Black Friday. It is NOT data.
#           Predictions built on it are labelled "heuristic, low confidence".
# cm_extra_drop_pct: same idea for Cyber Monday vs Black Friday.

categories:
  pc_components:
    label: "PC components"
    keywords: ["rtx", "geforce", "radeon", "rx 7*", "rx 9*", "grafikkarte", "graphics card", "gpu",
