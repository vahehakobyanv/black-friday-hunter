# Product categories.
#
# keywords: matched (case-insensitive, word-boundary) against the title. A trailing
#           '*' makes it a prefix: "galaxy s*" matches "Galaxy S25".
#           Order matters: the FIRST category whose keyword matches wins, so the
#           more specific categories (PC components) come first.
# feed_categories: category names used by the source feeds that map here.
# est_weight_kg: ESTIMATED shipping weight used ONLY when the source gives no
#           weight. Always labelled "estimated weight" in the report. Edit freely.
# bf_extra_drop_pct: HEURISTIC assumption of how much further a typical price in
#           this category may fall between now and Black Friday. It is NOT data.
#           Predictions built on it are labelled "heuristic, low confidence".
# cm_extra_drop_pct: same idea for Cyber Monday vs Black Friday.

categories:
  pc_components:
    label: "PC components"
    keywords: ["rtx", "geforce", "radeon", "rx 7*", "rx 9*", "grafikkarte", "graphics card", "gpu",
               "ryzen", "core i3", "core i5", "core i7", "core i9", "core ultra", "prozessor", "cpu",
               "ddr4", "ddr5", "ram kit", "arbeitsspeicher", "nvme", "ssd", "m.2", "hdd", "festplatte",
               "hard drive", "motherboard", "mainboard", "monitor", "netzteil", "power supply", "psu",
               "990 pro", "wd black", "crucial", "kingston fury", "corsair vengeance"]
    feed_categories: ["Computers", "Video Cards", "Computer Components", "PC Components", "Hardware",
                      "Upgrades & Components", "Storage", "Monitors"]
    est_weight_kg: 2.0
    bf_extra_drop_pct: 5
    cm_extra_drop_pct: 2
  laptops:
    label: "Computers & laptops"
    keywords: ["laptop", "notebook", "macbook", "chromebook", "thinkpad", "zenbook", "vivobook",
               "ideapad", "legion", "rog strix", "xps", "spectre", "envy", "desktop pc", "mac mini",
               "imac", "mini pc", "gaming pc"]
    feed_categories: ["Laptops", "Desktops", "Computers & Tablets"]
    est_weight_kg: 3.5
    bf_extra_drop_pct: 7
    cm_extra_drop_pct: 2
  smartphones:
    label: "Smartphones & accessories"
    keywords: ["iphone", "galaxy s*", "galaxy z*", "galaxy a*", "pixel", "smartphone", "handy",
               "oneplus", "xiaomi", "redmi", "airpods", "galaxy buds", "earbuds", "charger",
               "power bank", "powerbank", "ipad", "tablet", "galaxy tab"]
    feed_categories: ["Phones", "Mobile", "Phones & Cell Phones", "Smartphones", "Tablet",
                      "Handys & Smartphones"]
    est_weight_kg: 1.0
    bf_extra_drop_pct: 5
    cm_extra_drop_pct: 2
  gaming:
    label: "Gaming consoles & accessories"
    keywords: ["playstation", "ps5", "ps4", "xbox", "nintendo", "switch 2", "steam deck",
               "dualsense", "controller", "gaming headset", "rog ally", "legion go"]
    feed_categories: ["Gaming", "Video Games", "Consoles", "Games"]
    est_weight_kg: 1.5
    bf_extra_drop_pct: 5
    cm_extra_drop_pct: 2
  tv_electronics:
    label: "TVs & electronics"
